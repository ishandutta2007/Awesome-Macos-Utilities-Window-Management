<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .snapping-window-1 {
      animation: floatWin1 6s ease-in-out infinite alternate;
    }
    .snapping-window-2 {
      animation: floatWin2 7s ease-in-out infinite alternate;
    }
    .indicator-pulse {
      animation: pulseGlow 3s infinite;
    }

    @keyframes floatWin1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatWin2 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(6px) translateX(-3px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="url(#windowBorder)" stroke-width="1.5" />

  <!-- Background Grid Lines -->
  <g opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="200" y1="0" x2="200" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="400" y1="0" x2="400" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="800" y1="0" x2="800" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="1020" cy="140" r="140" fill="url(#accentGlow)" filter="url(#glow)" class="indicator-pulse" />
  <circle cx="150" cy="80" r="90" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Dynamic / Animated macOS UI Layout (Right Side, strictly separated from text) -->
  <g id="dynamic-window-cards" transform="translate(730, 45)">
    <!-- Window 1: Large Tiled Frame (Background Window) -->
    <g class="snapping-window-2">
      <rect x="0" y="0" width="410" height="265" rx="10" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
      <!-- macOS Window Traffic Lights -->
      <circle cx="22" cy="20" r="5.5" fill="#ff5f56" />
      <circle cx="38" cy="20" r="5.5" fill="#ffbd2e" />
      <circle cx="54" cy="20" r="5.5" fill="#27c93f" />
      <rect x="75" y="15" width="120" height="10" rx="5" fill="rgba(148, 163, 184, 0.3)" />
      
      <!-- Tiling Split Line Mockup -->
      <line x1="200" y1="35" x2="200" y2="255" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" stroke-dasharray="5,3" />
      
      <!-- Left Tile Content -->
      <rect x="20" y="50" width="165" height="90" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <rect x="35" y="65" width="110" height="8" rx="4" fill="#38bdf8" opacity="0.7" />
      <rect x="35" y="83" width="130" height="6" rx="3" fill="#64748b" opacity="0.6" />
      <rect x="35" y="97" width="90" height="6" rx="3" fill="#64748b" opacity="0.4" />

      <rect x="20" y="152" width="165" height="95" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <rect x="35" y="170" width="100" height="8" rx="4" fill="#818cf8" opacity="0.7" />
      <rect x="35" y="188" width="120" height="6" rx="3" fill="#64748b" opacity="0.5" />
      <rect x="35" y="202" width="75" height="6" rx="3" fill="#64748b" opacity="0.4" />
    </g>

    <!-- Window 2: Foreground Floating Snap Card (Active Window) -->
    <g class="snapping-window-1" transform="translate(125, 55)">
      <rect x="0" y="0" width="290" height="205" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="url(#primaryGlow)" stroke-width="1.5" filter="url(#subtleGlow)" />
      <!-- Traffic Lights -->
      <circle cx="18" cy="18" r="5" fill="#ff5f56" />
      <circle cx="33" cy="18" r="5" fill="#ffbd2e" />
      <circle cx="48" cy="18" r="5" fill="#27c93f" />
      <text x="70" y="22" fill="#94a3b8" font-family="monospace" font-size="11">macOS Workspace Hub</text>

      <!-- Window Workspace Mockup (Interactive Snapping Layout) -->
      <g transform="translate(18, 38)">
        <!-- Quarter Split 1 -->
        <rect x="0" y="0" width="120" height="70" rx="5" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">⌥ ⌘ ←</text>
        <text x="12" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Left Snap</text>

        <!-- Quarter Split 2 -->
        <rect x="134" y="0" width="120" height="70" rx="5" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1" />
        <text x="146" y="24" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold">⌥ ⌘ →</text>
        <text x="146" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Right Snap</text>

        <!-- Command Palette Bar / Quick Launcher Mockup -->
        <g transform="translate(0, 84)">
          <rect x="0" y="0" width="254" height="65" rx="7" fill="rgba(30, 41, 59, 0.95)" stroke="rgba(192, 132, 252, 0.6)" stroke-width="1" />
          <circle cx="18" cy="22" r="6" fill="none" stroke="#c084fc" stroke-width="1.5" />
          <line x1="23" y1="27" x2="28" y2="32" stroke="#c084fc" stroke-width="1.5" />
          <text x="36" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">Launch or Tile Windows...</text>
          
          <!-- Keycaps / Pills -->
          <rect x="16" y="40" width="48" height="17" rx="3" fill="rgba(56, 189, 248, 0.2)" />
          <text x="22" y="52" fill="#38bdf8" font-family="sans-serif" font-size="9.5">⌘ Space</text>
          
          <rect x="70" y="40" width="58" height="17" rx="3" fill="rgba(129, 140, 248, 0.2)" />
          <text x="76" y="52" fill="#818cf8" font-family="sans-serif" font-size="9.5">^ ⌥ Snap</text>

          <rect x="134" y="40" width="52" height="17" rx="3" fill="rgba(192, 132, 252, 0.2)" />
          <text x="140" y="52" fill="#c084fc" font-family="sans-serif" font-size="9.5">Menu Bar</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Foreground Title and Branding (Left aligned, never obstructed) -->
  <g transform="translate(65, 70)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="250" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="26" y="18" class="tagline">Curated macOS Directory</text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="76" class="title">
      <tspan fill="#ffffff">Awesome macOS</tspan>
      <tspan fill="url(#primaryGlow)"> Utilities</tspan>
    </text>
    
    <text x="0" y="120" class="title" font-size="33">
      <tspan fill="#e2e8f0">&amp; Window Management</tspan>
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="162" class="subtitle">
      Window Tiling, Snapping, Command Launchers &amp; Menu Bar Control
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 194)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="124" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="14" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">&#129695; Tiling &amp; Snap</text>

      <!-- Tag 2 -->
      <rect x="134" y="0" width="130" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="148" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">&#9889; Fast Launchers</text>

      <!-- Tag 3 -->
      <rect x="274" y="0" width="140" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="288" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">&#127864; Menu Bar Tools</text>

      <!-- Tag 4 -->
      <rect x="424" y="0" width="124" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="436" y="18" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">&#11088; Open Source</text>
    </g>
  </g>
</svg>